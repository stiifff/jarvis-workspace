[pytest]
# Config mínima para que `pytest` (sin args) corra la suite del backend de
# forma consistente. Antes no había config: plotspace/AGENTS.md decía "no usa
# pytest" mientras CLAUDE.md/QA sí — esto fija pytest como el runner oficial.
# Los tests siguen siendo corribles como scripts sueltos (bloque __main__).
testpaths = plotspace/tests
python_files = test_*.py
python_functions = test_*
addopts = -q
