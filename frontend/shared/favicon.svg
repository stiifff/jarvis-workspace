<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="plate" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1c1c28"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </radialGradient>
    <radialGradient id="core" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
    <radialGradient id="node" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </radialGradient>
  </defs>

  <!-- placa oscura redondeada: presencia en pestañas claras Y oscuras -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#plate)"/>

  <!-- spokes núcleo → satélites (más finos que los nodos: jerarquía) -->
  <g stroke="#8b5cf6" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="32" x2="32"    y2="10"/>
    <line x1="32" y1="32" x2="51.05" y2="43"/>
    <line x1="32" y1="32" x2="12.95" y2="43"/>
  </g>

  <!-- 3 agentes satélite (chicos: el núcleo manda) -->
  <circle cx="32"    cy="10" r="6" fill="url(#node)"/>
  <circle cx="51.05" cy="43" r="6" fill="url(#node)"/>
  <circle cx="12.95" cy="43" r="6" fill="url(#node)"/>

  <!-- núcleo orquestador (el doble que los satélites) con halo de energía -->
  <circle cx="32" cy="32" r="15.5" fill="#a78bfa" opacity="0.28"/>
  <circle cx="32" cy="32" r="12" fill="url(#core)"/>
  <circle cx="28" cy="28" r="2.8" fill="#ffffff"/>
</svg>
